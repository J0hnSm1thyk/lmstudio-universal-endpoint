name: Bug report
description: Report a reproducible problem with the plugin
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, Authorization headers, private endpoint URLs, or sensitive prompts.

  - type: input
    id: lm-studio-version
    attributes:
      label: LM Studio version
      placeholder: "For example: 0.4.x"
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Endpoint software or provider
      description: Do not include private hostnames or credentials.
      placeholder: "For example: Z.ai, OpenRouter, vLLM, or llama.cpp"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain the expected and actual behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure...
        2. Send...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: sanitized-error
    attributes:
      label: Sanitized error output
      description: Remove credentials, tokens, private URLs, and conversation content before posting.
      render: text
